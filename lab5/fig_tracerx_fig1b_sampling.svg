<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Multiregion sequencing: regions, their mutations, and the tree</title>
<desc id="figure-desc">Schematic of Jamal-Hanjani et al., N Engl J Med 376:2109 (2017), Fig. 1B, in three steps joined by arrows. Step 1, multiregion sampling: the outline of one tumor with four sampled regions, R1 to R4. Step 2, mutations found in each region: four circles, one for each region, each with the same nine places for nine mutations; a filled square means the mutation was found in that region. Three mutations, in blue, are in all four regions. The other six, in red, are in some regions only: one is shared by R1, R2 and R3, one each is private to R1, R2 and R3, and two are private to R4. Step 3, tree of the regions: a blue trunk carrying the three mutations found in every region (clonal mutations) rises from the root; R4 branches off first, with its two private mutations; R1, R2 and R3 share a branch with one mutation and then separate, each with one private mutation. The red branches carry the subclonal mutations. The example is made up to show the idea; the lung, the chromosomes with copy-number changes, the clone diagrams and the genome-doubling mark of the original are left out.</desc>
