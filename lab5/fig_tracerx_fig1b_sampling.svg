<text x="112" y="26" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#243B49" text-anchor="middle" font-weight="bold">1. Multiregion sampling</text>
<text x="352" y="26" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#243B49" text-anchor="middle" font-weight="bold">2. Mutations found in each region</text>
<text x="604" y="26" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#243B49" text-anchor="middle" font-weight="bold">3. Tree of the regions</text>
</g>
