<svg xmlns="http://www.w3.org/2000/svg" width="760" height="318" viewBox="0 0 760 318" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Driver mutations on the trunk and on the branches in 100 lung cancers</title>
<desc id="figure-desc">Schematic of Jamal-Hanjani et al., N Engl J Med 376:2109 (2017), Fig. 4, reduced to the driver genes mutated in five or more tumors of one kind. Two panels of horizontal bars, adenocarcinoma on the left and squamous-cell carcinoma on the right. Each bar is one gene; its blue part is the share of tumors in which the mutation is on the trunk of the tumor's tree (clonal) and its red part the share in which it is on a branch (subclonal). The numbers after each bar are tumors with the mutation on a branch over all tumors with a mutation in the gene. Adenocarcinoma: RBM10 0 of 5; KEAP1 1 of 9; KRAS 3 of 26; TP53 4 of 29; EGFR 2 of 13; FAT1 1 of 5; STK11 2 of 7; RB1 2 of 5; MGA 5 of 9; NF1 4 of 7; PIK3CA 3 of 5. Squamous-cell carcinoma: TP53 2 of 27; NOTCH1 1 of 5; RASA1 2 of 5; NFE2L2 3 of 7; CDKN2A 4 of 8; FAT1 4 of 8; PIK3CA 5 of 7. Genes are in the paper's order, earliest at the top. The copy-number events, the mutational-signature pie charts, the timing against genome doubling and the genes mutated in fewer than five tumors are left out.</desc>
