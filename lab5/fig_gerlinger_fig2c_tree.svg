<svg xmlns="http://www.w3.org/2000/svg" width="560" height="392" viewBox="0 0 560 392" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">The authors' tree of the tumor regions of patient 1</title>
<desc id="figure-desc">Schematic of Gerlinger et al., N Engl J Med 366:883 (2012), Fig. 2C, redrawn with the branch lengths measured on the published figure, where length is the number of mutations (a scale bar marks 10 mutations). A long blue trunk of ubiquitous mutations runs from normal tissue to a fork. A yellow branch of shared primary mutations runs up to the primary-tumor regions: R4b leaves it first, then R9, the pretreatment biopsy PreP and R5, then R8, R1, R2 and R3 at its tip. A green branch of shared metastasis mutations runs down to the metastases: R4a leaves it first, then M2b, the pretreatment biopsy PreM, M1 and M2a at its tip. Short red branches are private mutations. Arrows mark where driver genes were hit: VHL on the trunk; SETD2 (frameshift), then KDM5C (missense and frameshift) and MTOR (missense) on the yellow branch; SETD2 (missense) and KDM5C (splice site) on the green branch; SETD2 (splice site), with a question mark, on the short branch to R4a.</desc>
