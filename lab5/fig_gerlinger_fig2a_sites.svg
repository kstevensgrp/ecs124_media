<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Where the samples of patient 1 were taken</title>
<desc id="figure-desc">Schematic of Gerlinger et al., N Engl J Med 366:883 (2012), Fig. 2A, drawn as outlines in place of the photograph and the anatomical painting. Left, in a box: the outline of the cut surface of the primary kidney tumor, 10 cm across, with nine biopsy sites marked and labelled with the tumor grade found there: R1 (G3), R2 (G3), R3 (G4), R4 (G1), R5 (G4), R6 (G1), R7 (G4), R8 (G4), and R9, which was taken from the outer edge of the lobe that holds R5. Right: the outline of a torso with both kidneys. A line joins the box to the primary tumor on one kidney. M1 is a small metastasis in the fat next to that kidney (perinephric). M2a and M2b are the upper and lower parts of a metastasis in the chest wall. Positions are approximate. The lung metastases of the original figure, which were not sampled, are left out.</desc>
