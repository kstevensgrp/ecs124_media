<svg xmlns="http://www.w3.org/2000/svg" width="760" height="292" viewBox="0 0 760 292" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Gene maps of WHCV and two related coronavirus genomes</title>
<desc id="figure-desc">Schematic of Wu et al. 2020, Fig. 1 (Nature 579:265, CC BY 4.0), simplified. Three genomes drawn to one scale, one above another, each a thin line with four boxes: WHCV, 29,903 bp, at the top; the bat coronavirus SL-CoVZC45, 29,802 bp; and SARS-CoV Tor2, 29,751 bp. The layout is the same in all three. The replicase gene, drawn dark in two parts labelled 1a and 1b, runs from near the start to about position 21,500 (in WHCV positions 266 to 21,555, 21,290 of 29,903 bases). The spike gene S, in orange, follows it. One grey box stands for all the remaining genes, E, M, N and smaller ones (in WHCV 9 genes, ORF3a to ORF10), which the paper draws one by one. WHCV's positions are those of the lab's sarscov2_genes.tsv; the other two genomes' are from GenBank MG772933.1 and AY274119.3. A position axis runs along the bottom.</desc>
