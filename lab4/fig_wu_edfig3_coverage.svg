<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Read depth along the WHCV genome</title>
<desc id="figure-desc">Schematic of Wu et al. 2020, Extended Data Fig. 3 (Nature 579:265, CC BY 4.0), simplified. A filled plot of read depth against position along the 29,903 bases of the WHCV genome, drawn in 100-base steps from heights measured off the paper's figure, so the values are approximate. The depth is far from even: half of the genome is below about 430 reads, while narrow peaks rise to several thousand, the tallest, about 6,900 in this drawing, near position 27,300. A line of text gives the paper's genome coverage, 99.99 percent, or 29,901 of 29,903 bases. The vertical axis runs from 0 to 7,000 reads. The paper's mean depth label is omitted.</desc>
