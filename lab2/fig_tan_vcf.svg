<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="638" viewBox="0 0 1140 638" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Four VCF representations of the same CA deletion</title>
<desc id="figure-desc">The reference GGGCACACACAGGG and alternate GGGCACACAGGG differ by one CA deletion. Four equivalent records are shown, with each REF and ALT positioned beneath its reference start on the left and the POS, REF, and ALT fields on the right. A: 6 CAC C. B: 3 GCACA GCA. C: 2 GGCA GG. D: 3 GCA G. Only D is normalized. No caption is displayed.</desc>
