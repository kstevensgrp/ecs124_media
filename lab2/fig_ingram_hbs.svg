<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="950" viewBox="0 0 1100 950" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Ingram peptide fingerprint schematic</title>
<desc id="figure-desc">Ten labeled peptide spots redrawn from the supplied Ingram figure. Normal hemoglobin uses solid outlines, sickle hemoglobin dashed outlines. His-Val-Leu-Leu and Glu-Lys have both outlines. Source G and Ly labels are expanded to Glu and Lys. The chromatography arrow points upward. The original minus sign, origin dot, and plus sign are retained. No caption or legend is displayed.</desc>
