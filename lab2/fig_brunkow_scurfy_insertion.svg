<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="260" viewBox="0 0 2200 260" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Foxp3 exons and the scurfy insertion</title>
<desc id="figure-desc">Schematic redraw of the supplied Foxp3 gene diagram. Exons -2b, -2a, -1, and 1 through 11 are shown, with coding portions filled and untranslated portions open. Restriction labels Hp and Bs and endpoint coordinates -12.5 kb and +18.3 kb are retained. The exon 8 callout shows wild type GGACAAGAGCTC above scurfy GGACAAAAGAGCTC. The inserted AA, mutant positions 7 and 8, are highlighted. Intron spacing is schematic.</desc>
