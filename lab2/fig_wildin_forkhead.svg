<svg xmlns="http://www.w3.org/2000/svg" width="1962" height="416" viewBox="0 0 1962 416" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Forkhead-domain alignment and IPEX mutations</title>
<desc id="figure-desc">Schematic of the supplied Wildin forkhead-domain comparison. The four rows show human scurfin, mouse scurfin, HNF3-gamma and Genesis. The ruler uses human scurfin residue numbers, with the first displayed residue R337. Orange IPEX markers show C above F371, T above A384, W above R397, and the original ## notation above G430 and P431. Source contact annotations, helix underlines and structural labels H1, H2, L1, H4, H3, S2, W1, S3 and W2 are retained. Original 1962:416 aspect ratio.</desc>
