<text x="452.00" y="470.00" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12.00" fill="#000000" text-anchor="start" font-weight="normal" xml:space="preserve">3 ≥ 1   →   case 2b</text>
