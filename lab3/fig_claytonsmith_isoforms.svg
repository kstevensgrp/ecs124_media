<svg xmlns="http://www.w3.org/2000/svg" width="760" height="232" viewBox="0 0 760 232" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Alternative splicing inside exon 8 of KAT6B</title>
<desc id="figure-desc">Schematic of Clayton-Smith et al. 2011, Fig. 1D. Three rows, one for each protein length the paper shows: 2,073, 1,890 and 1,781 residues. Each row draws the coding exons 3 to 18 to scale from the lab's exon table, joined end to end, with exon 8 in red. The full-length form keeps all of exon 8, residues 355 to 664. The 1,890-residue form keeps exon 8 up to residue 481 and the 1,781-residue form up to residue 372; a dashed line spans the part each one skips. Everything before exon 8 and everything from exon 9 on is drawn in the same place in all three rows. The paper's five exon-intron diagrams, three of which differ only in non-coding exons and give the 1,781-residue protein, its introns and its untranslated exons are omitted.</desc>
<rect x="0" y="0" width="760" height="232" fill="#FFFFFF"/>
