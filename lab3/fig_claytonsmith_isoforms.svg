<text x="60.46" y="48" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#60727D" text-anchor="middle">exon 3</text>
<text x="179.78" y="48" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#C7474E" text-anchor="middle" font-weight="bold">exon 8</text>
<text x="514.84" y="48" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#60727D" text-anchor="middle">exon 18</text>
</g>
