<svg xmlns="http://www.w3.org/2000/svg" width="760" height="318" viewBox="0 0 760 318" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Truncating KAT6B mutations on the 2,073-residue protein</title>
<desc id="figure-desc">Schematic of Clayton-Smith et al. 2011, Fig. 1C. A bar for the 2,073-residue KAT6B protein with a residue scale. The MYST domain (the paper's MOZ_SAS family box) is dark; the H15 domain and the two PHD zinc fingers are white boxes. Domain boundaries are measured from the paper's figure and are approximate. Three callouts carry the paper's labels, each placed by its coding position: c.527dup at residue 176, c.3018del at residue 1006, and a list of nine mutations bracketed over residues 1357 to 1912, all after the MYST domain. The label c.5367_5368del is kept as the figure prints it and drawn in orange because Table 2 gives that change as c.5370_5373dup. The paper's bar marking the region that interacts with RUNX2 is omitted.</desc>
