<svg xmlns="http://www.w3.org/2000/svg" width="760" height="232" viewBox="0 0 760 232" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Kat6b-deficient mice beside control littermates</title>
<desc id="figure-desc">Schematic of Clayton-Smith et al. 2011, Fig. 2A and 2B, drawn as outlines in place of the photographs. Panel A: the heads of a Qkf gt/gt mouse and a control littermate facing each other; the mutant's eye is smaller and its opening shorter and narrower. Panel B: the two whole animals facing each other; the mutant is about two thirds the length of the control. Only body size and eye size are meant to be read from the drawing; every other detail of the animals is generic.</desc>
