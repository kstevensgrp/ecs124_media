<svg xmlns="http://www.w3.org/2000/svg" width="760" height="236" viewBox="0 0 760 236" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Filtering the exome variants of four children down to KAT6B</title>
<desc id="figure-desc">Schematic of Clayton-Smith et al. 2011, Table 1. Four rows, persons 1 to 4, and seven columns of variant counts after each filtering step: all single-nucleotide variants; those not in dbSNP132; nonsynonymous and splice-site variants; those not in dbSNP132; nonsense variants not in dbSNP132, printed over two columns as in the paper; and indels not in dbSNP132. The three counts the paper marks as lying in KAT6B, an indel in person 1, an indel in person 2 and a nonsense variant in person 4, are circled in orange. The paper's footnotes on abbreviations are omitted.</desc>
