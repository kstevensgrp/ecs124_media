<svg xmlns="http://www.w3.org/2000/svg" width="968" height="232" viewBox="0 0 968 232" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Kat6b-deficient mice beside control littermates, and their hind feet</title>
<desc id="figure-desc">Schematic of Clayton-Smith et al. 2011, Fig. 2A, 2B and 2F, drawn as outlines in place of the photographs, in three boxed panels in a row. Panel A: the heads of a Qkf gt/gt mouse and a control littermate facing each other; the mutant's eye is smaller and its opening shorter and narrower. Panel B: the two whole animals facing each other; the mutant is about two thirds the length of the control. Panel C: the two hind feet seen from below with digits I to V labelled; the Qkf gt/gt foot on the left is longer and more slender, and its first digit, labelled in orange, is much longer. Only body size, eye size and the first digit are meant to be read from the drawing; proportions are approximate.</desc>
