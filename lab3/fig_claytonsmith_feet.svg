<title id="figure-title">Hind feet of a Kat6b-deficient mouse and a control</title>
<desc id="figure-desc">Schematic of Clayton-Smith et al. 2011, Fig. 2F, drawn as outlines in place of the photographs. Two hind feet seen from below with digits I to V labelled, the first digits toward the middle of the figure. The Qkf gt/gt foot on the left is longer and more slender than the control foot on the right, and its first digit, labelled in orange, is much longer. Proportions are approximate.</desc>
