<svg xmlns="http://www.w3.org/2000/svg" width="760" height="432" viewBox="0 0 760 432" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">KAT6B sequence variants in the 19 individuals tested</title>
<desc id="figure-desc">Schematic of Clayton-Smith et al. 2011, Table 2. One row for each of individuals 1 to 14 with the mutation on transcript NM_012330.2 as a coding-sequence change and a protein change, its exon, whether the parents carry it (no, or not tested) and a comment (typical, SBBYSS-like and not typical, or milder phenotype). Individuals 15 to 19, in whom no mutation was found and whose syndrome is atypical, share one row. The row of individual 4 is shaded. The transcript name is given once in the header; the paper's literature cross-references and its notes on other chromosome changes are omitted.</desc>
