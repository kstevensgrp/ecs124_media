<svg xmlns="http://www.w3.org/2000/svg" width="760" height="236" viewBox="0 0 760 236" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Sanger sequencing of KAT6B c.4069 in individual 4 and both parents</title>
<desc id="figure-desc">Schematic of Clayton-Smith et al., Am J Hum Genet 89:675 (2011), Fig. 1B. Three sequencing traces, mother, individual 4 and father, over the same 15 bases of the KAT6B coding sequence (AGAGGAGGAGGAGGA, from the lab's data). An arrow marks c.4069 in each. The parents have one full G peak there. Individual 4 has a half-height G peak and a half-height T peak at the same place. Peak heights and spacing are schematic; the instrument's ruler is omitted.</desc>
