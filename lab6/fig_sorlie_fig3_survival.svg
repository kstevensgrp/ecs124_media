<svg xmlns="http://www.w3.org/2000/svg" width="760" height="318" viewBox="0 0 760 318" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Survival of 49 patients by the subtype of their tumor</title>
<desc id="figure-desc">Schematic of Sorlie et al., PNAS 98:10869 (2001), Fig. 3, panels A and B. Two panels of step-shaped survival curves over 96 months, one color per subtype: A, overall survival; B, relapse-free survival. In both, luminal A stays highest (about 0.9 in A), luminal B+C and normal breast-like are in the middle, and the basal-like and ERBB2+ curves fall fastest and end lowest. Each panel is marked P &lt; 0.01. The steps were read off the paper's figure and are approximate; the marks for censored patients and the paper's panels C and D are omitted.</desc>
