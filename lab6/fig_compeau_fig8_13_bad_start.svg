<svg xmlns="http://www.w3.org/2000/svg" width="760" height="268" viewBox="0 0 760 268" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">A bad start for the Lloyd algorithm</title>
<desc id="figure-desc">Schematic after Compeau &amp; Pevzner, Chapter 8, Figure 8.13, drawn for the course by running the lab's reference code on five clumps of ten points, numbered 1 to 5. Top: the five starting centers. None is in clump 1, two are in clump 3 and one is in each of clumps 2, 4 and 5. Bottom: where the Lloyd algorithm stops. Clumps 1 and 2 are one cluster with its center between them, clump 3 is split into two clusters, and clumps 4 and 5 are each a cluster.</desc>
