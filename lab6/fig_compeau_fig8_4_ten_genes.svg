<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Ten yeast genes around the diauxic shift</title>
<desc id="figure-desc">Schematic after Compeau &amp; Pevzner, Chapter 8, Figure 8.4, drawn from the lab's data. Left: a table of ten yeast genes with their seven log2 expression ratios at hours -6 to +6. Right: the same ten rows as lines over time. Three genes switch on after the shift (green, rising above 3), three switch off (red, falling to about -3), and four stay flat (blue). The six that change are in the lab's file of 230 genes; the four flat ones are not.</desc>
