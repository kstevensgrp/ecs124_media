<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Euclidean distance versus correlation for three profiles">
<title>Euclidean distance versus correlation for three profiles</title>
<rect width="780" height="300" fill="#FFFFFF"/>
<text x="20.0" y="26.0" font-size="16" fill="#1F2933" text-anchor="start" font-weight="bold" >Size or shape? Two ways to measure how alike two genes are</text>
<text x="20.0" y="46.0" font-size="12" fill="#52606D" text-anchor="start" font-weight="normal" >Three made-up profiles over the seven time points</text>
<rect x="60.0" y="70.0" width="300.0" height="200.0" fill="none" stroke="#CBD2D9" stroke-width="1" rx="0" />
<line x1="60.0" y1="236.7" x2="360.0" y2="236.7" stroke="#52606D" stroke-width="1" />
<text x="54.0" y="240.7" font-size="10" fill="#52606D" text-anchor="end" font-weight="normal" >0</text>
<text x="54.0" y="174.0" font-size="10" fill="#52606D" text-anchor="end" font-weight="normal" >2</text>
<text x="54.0" y="107.3" font-size="10" fill="#52606D" text-anchor="end" font-weight="normal" >4</text>
<text x="60.0" y="284.0" font-size="10" fill="#52606D" text-anchor="middle" font-weight="normal" >-6</text>
<text x="110.0" y="284.0" font-size="10" fill="#52606D" text-anchor="middle" font-weight="normal" >-4</text>
<text x="160.0" y="284.0" font-size="10" fill="#52606D" text-anchor="middle" font-weight="normal" >-2</text>
<text x="210.0" y="284.0" font-size="10" fill="#52606D" text-anchor="middle" font-weight="normal" >0</text>
<text x="260.0" y="284.0" font-size="10" fill="#52606D" text-anchor="middle" font-weight="normal" >+2</text>
<text x="310.0" y="284.0" font-size="10" fill="#52606D" text-anchor="middle" font-weight="normal" >+4</text>
<text x="360.0" y="284.0" font-size="10" fill="#52606D" text-anchor="middle" font-weight="normal" >+6</text>
<polyline points="60.0,230.0 110.0,226.7 160.0,230.0 210.0,220.0 260.0,203.3 310.0,190.0 360.0,183.3" fill="none" stroke="#d62728" stroke-width="2.4"/>
<text x="366.0" y="187.3" font-size="12" fill="#d62728" text-anchor="start" font-weight="bold" >A</text>
<polyline points="60.0,216.7 110.0,206.7 160.0,216.7 210.0,186.7 260.0,136.7 310.0,96.7 360.0,76.7" fill="none" stroke="#9467bd" stroke-width="2.4"/>
<text x="366.0" y="80.7" font-size="12" fill="#9467bd" text-anchor="start" font-weight="bold" >B = 3 × A</text>
<polyline points="60.0,226.7 110.0,233.3 160.0,236.7 210.0,240.0 260.0,243.3 310.0,250.0 360.0,253.3" fill="none" stroke="#2ca02c" stroke-width="2.4"/>
<text x="366.0" y="257.3" font-size="12" fill="#2ca02c" text-anchor="start" font-weight="bold" >C</text>
<text x="440.0" y="100.0" font-size="13" fill="#52606D" text-anchor="start" font-weight="bold" ></text>
<text x="550.0" y="100.0" font-size="13" fill="#52606D" text-anchor="start" font-weight="bold" >Euclidean</text>
<text x="660.0" y="100.0" font-size="13" fill="#52606D" text-anchor="start" font-weight="bold" >1 − correlation</text>
<text x="440.0" y="128.0" font-size="13" fill="#1F2933" text-anchor="start" font-weight="normal" >A and B</text>
<text x="550.0" y="128.0" font-size="13" fill="#1F2933" text-anchor="start" font-weight="normal" >4.87</text>
<text x="660.0" y="128.0" font-size="13" fill="#1F2933" text-anchor="start" font-weight="normal" >0.00</text>
<text x="440.0" y="156.0" font-size="13" fill="#1F2933" text-anchor="start" font-weight="normal" >A and C</text>
<text x="550.0" y="156.0" font-size="13" fill="#1F2933" text-anchor="start" font-weight="normal" >3.09</text>
<text x="660.0" y="156.0" font-size="13" fill="#1F2933" text-anchor="start" font-weight="normal" >1.94</text>
<text x="440.0" y="200.0" font-size="12" fill="#1F2933" text-anchor="start" font-weight="normal" >Euclidean distance: A is closer to C,</text>
<text x="440.0" y="218.0" font-size="12" fill="#1F2933" text-anchor="start" font-weight="normal" >because B's values are larger.</text>
<text x="440.0" y="244.0" font-size="12" fill="#1F2933" text-anchor="start" font-weight="normal" >Correlation: A and B have the same shape</text>
<text x="440.0" y="262.0" font-size="12" fill="#1F2933" text-anchor="start" font-weight="normal" >(distance 0); C goes the other way.</text>
</svg>
