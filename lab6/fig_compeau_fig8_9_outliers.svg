<svg xmlns="http://www.w3.org/2000/svg" width="760" height="284" viewBox="0 0 760 284" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Two scores for a set of three centers, on data with two outliers</title>
<desc id="figure-desc">Schematic after Compeau &amp; Pevzner, Chapter 8, Figure 8.9, drawn for the course and computed with the lab's reference code. The same 23 points, three clumps of seven and two isolated outliers, are clustered twice with three centers. Left: the Lloyd algorithm, which lowers the average squared distance, puts one center in each clump; the two outliers join the nearest clump. Right: choosing centers to make the largest distance small (Farthest First Traversal) puts two of the three centers on the two outliers, each a cluster of one point, and leaves all three clumps in one cluster.</desc>
