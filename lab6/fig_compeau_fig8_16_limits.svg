<svg xmlns="http://www.w3.org/2000/svg" width="760" height="446" viewBox="0 0 760 446" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Clusters the eye sees and the Lloyd algorithm does not</title>
<desc id="figure-desc">Schematic after Compeau &amp; Pevzner, Chapter 8, Figure 8.16, drawn for the course; the bottom row is computed with the lab's reference code. Three sets of points, each shown twice. Top row, the clusters the eye sees: two tall stripes side by side; two interlocking arcs; one sparse cloud beside two dense clumps. Bottom row, the clusters the Lloyd algorithm finds: the stripes are cut across into a top half and a bottom half; each arc is split between the two clusters; the sparse cloud is split in two while the two dense clumps become one cluster.</desc>
