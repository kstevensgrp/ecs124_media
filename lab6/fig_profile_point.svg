<text x="20.0" y="280.0" font-size="13" fill="#1F2933" text-anchor="start" font-weight="normal" >As points in seven dimensions, the genes are far apart or close together:</text>
<text x="40.0" y="304.0" font-size="13" fill="#1F2933" text-anchor="start" font-weight="normal" >d(gene 113, gene 188) = 0.72: similar profiles, close points</text>
<text x="40.0" y="326.0" font-size="13" fill="#1F2933" text-anchor="start" font-weight="normal" >d(gene 113, gene 60) = 9.50: opposite profiles, distant points</text>
<text x="40.0" y="350.0" font-size="12" fill="#52606D" text-anchor="start" font-weight="normal" >d(x, y) = √( Σ (xᵢ − yᵢ)² ), the Euclidean distance that math.dist computes</text>
