<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Cutting the TOY tree at two heights</title>
<desc id="figure-desc">Schematic after Compeau &amp; Pevzner, Chapter 8, Figure 8.23, drawn from the lab's TOY data with the lab's reference code. The tree of the ten TOY genes is shown twice, each time with a dashed horizontal line across it. Left: the line crosses four branches and gives four clusters, g3 g5 g8, g7, g1 g6, and g2 g4 g9 g10. Right: a lower line crosses six branches and gives six clusters, g3 g5 g8, g7, g1, g6, g2 g4 g10, and g9. Leaves and branches below the line are colored by cluster.</desc>
