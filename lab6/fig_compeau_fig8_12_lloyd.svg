<svg xmlns="http://www.w3.org/2000/svg" width="760" height="536" viewBox="0 0 760 536" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">The Lloyd algorithm with k = 3</title>
<desc id="figure-desc">Schematic after Compeau &amp; Pevzner, Chapter 8, Figure 8.12, drawn for the course by running the lab's reference code on 21 points in three clumps. Six panels. 1: the first three points are the starting centers, one in the top left clump and two in the bottom clump. 2: every point joins its nearest center, so one of the bottom centers takes the right clump as well. 3: each center moves to its cluster's center of gravity. 4: points are assigned again and each clump becomes one cluster. 5: the centers move again. 6: the assignment no longer changes, and the algorithm stops.</desc>
