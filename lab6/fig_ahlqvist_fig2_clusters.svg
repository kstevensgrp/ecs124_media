<svg xmlns="http://www.w3.org/2000/svg" width="864" height="300" viewBox="0 0 864 300" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">The five diabetes clusters, by five of the clustering variables</title>
<desc id="figure-desc">Schematic of Ahlqvist et al., Lancet Diabetes Endocrinol 6:361 (2018), Fig. 2. Five panels of box plots, one per variable (HbA1c, body-mass index, age at diagnosis, HOMA2-B and HOMA2-IR), each with one box for each of the five clusters SAID, SIDD, SIRD, MOD and MARD. Boxes run from the first to the third quartile with a line at the median, and whiskers are the paper's; all were measured off the paper's figure. SIDD has the highest HbA1c and low HOMA2-B. SIRD has the highest HOMA2-B and HOMA2-IR. MOD has the highest body-mass index and the youngest patients. MARD and SIRD have the oldest. The paper's outlying points are omitted.</desc>
